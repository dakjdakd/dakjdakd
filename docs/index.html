", "commit_shas": ["3976f5d4b8e5013c3013a7ac3f74f10eb609a639", "411ab0552abc5ab0b7906a072681728397ce8bfe", "db7d914fdf105bddeef0cd9a4689031e7de462e8"]}, {"repo": "vectorize-io/hindsight", "number": 4740, "html_url": "https://github.com/vectorize-io/hindsight/pull/4740", "title": "fix(clients): download presigned export archives without API credentials", "merged_at": "2026-09-25T13:34:46Z", "commit_shas": ["4d07694145dffaf52212ecd94505559cd4ee2876", "5b00c225d3a595dabdc7fee792c22c17a057ba09", "e23de7e39797772b26741399c6874d596f8422ae"]}, {"repo": "vectorize-io/hindsight", "number": 4742, "html_url": "https://github.com/vectorize-io/hindsight/pull/4742", "title": "fix(helm): route Ingress data API requests through /v1", "merged_at": "2026-09-25T12:21:37Z", "commit_shas": ["400c44b2a6cb8761efdc245af56bae062b07298b", "d2a93760a87504ed1636de2e7f4cd4176e2374e5", "dc642d650d91c4ca150cac1e937e05c8ddea83fc"]}, {"repo": "NandhaKishorM/laya", "number": 438, "html_url": "https://github.com/NandhaKishorM/laya/pull/438", "title": "fix(router): share concurrent TypeScript model loads", "merged_at": "2026-09-25T11:33:50Z", "commit_shas": ["d5f22140800ba91fd7fc705940f9241e9a170a09", "da471cbd82c852aaa95d803d1e1fc35e30f2603b", "ff09084cd31c8bc28b6c2cf2332bcc02e4b49183"]}, {"repo": "NandhaKishorM/laya", "number": 442, "html_url": "https://github.com/NandhaKishorM/laya/pull/442", "title": "fix(structured): reject enum choice label collisions", "merged_at": "2026-09-25T11:23:26Z", "commit_shas": ["3560057f87378ece0a78cba8013ef3f69c14b9de", "a6da0bfc511059e5b2a5b93048892040d5b5a795"]}, {"repo": "NandhaKishorM/laya", "number": 440, "html_url": "https://github.com/NandhaKishorM/laya/pull/440", "title": "fix(mcp): preserve supported question fields", "merged_at": "2026-09-25T11:22:42Z", "commit_shas": ["b8ff32e8a2931b2215184ca12b0a43d7cb1d6efd", "d0776d7b30c9cb994134d34ece9d247d208ca652"]}, {"repo": "deepset-ai/haystack", "number": 12884, "html_url": "https://github.com/deepset-ai/haystack/pull/12884", "title": "fix: accept dictionary-valued flat pipeline inputs", "merged_at": "2026-09-24T15:32:03Z", "commit_shas": ["25bceb0978a5d80e9d24ef8ddb0b8ce1ace9f9cb", "2b782849fd12ff9529daaafe303a86fb9be8a58a", "3c770bb304e80c0e76b11bc1fc2403cfdb2cbd06", "7b98de50e0658e2420eee38968a1ba430773c92c", "9a0af6afe11abfa0c68f2ee1ba4f6896b62cceba", "cd546a0f1428a9eb8b516f474d06a66e6db349fc"]}, {"repo": "vercel/ai", "number": 21228, "html_url": "https://github.com/vercel/ai/pull/21228", "title": "fix: preserve loading and cancellation state when restarting completion requests", "merged_at": "2026-09-21T20:04:02Z", "commit_shas": ["0343bb177b07c048c55654b67ed97d12e54d7c1a", "88423e23b95177f825353341a7f656ea6b1f97d4", "c321c3e766090bc9767bd21c8f2c062eb4c01f26", "eb7024e7a05e53c2244e8e77c017b8ac3227a3b9"], "merge_commit_fingerprint": {"message": "fix: preserve loading and cancellation state when restarting completion requests (#21228)\n\n## Background\n\nRestarting useCompletion immediately after stop() allowed the\nreplacement stream to continue while loading became false and subsequent\nstop() calls could no longer cancel it.\n\n## Root Cause\n\ncallCompletionApi unconditionally cleared shared loading, error,\ncompletion, and abort-controller state when an older request settled.\nDeterministic overlapping-request tests confirmed that aborted,\nsuccessful, and failed requests could overwrite state owned by a newer\nrequest.\n\n## Summary\n\nAdded request-ownership checks to callCompletionApi and updated React,\nVue, Svelte, and Angular completion integrations to retain the active\ncontroller until its owning request settles. React now stores the\ncontroller in a ref for synchronous cancellation.\n\n## Testing\n\nAdded core regression coverage for text and data protocols across abort,\nsuccess, and error outcomes, plus a React hook test for stopping and\nimmediately restarting a request.\n\n## End-to-end Validation\n\n- `replay_original_reproduction`: the immutable reproduction completed\nsuccessfully across all protocols and outcomes; status was\n`no-longer-reproduces`.\n\n## Related Issues\n\nFixes #21224\n\nCloses #21226\n\n---------\n\nCo-authored-by: ai-sdk-factory <308175966+ai-sdk-factory@users.noreply.github.com>\nCo-authored-by: dakjdakd <164857476+dakjdakd@users.noreply.github.com>", "author": {"name": "ai-sdk-factory[bot]", "email": "305873210+ai-sdk-factory[bot]@users.noreply.github.com", "date": "2026-09-21T20:04:01Z"}}}, {"repo": "vercel/ai", "number": 21229, "html_url": "https://github.com/vercel/ai/pull/21229", "title": "fix: TUI Backspace submits partial Unicode graphemes", "merged_at": "2026-09-21T18:56:20Z", "commit_shas": ["3964576e3646e883cce8549acac188d88dbbf781", "51d15e69a4d31be06455eb44abb7dbd93c4a6d9c", "abcd1d520df5ef00851a7b50f6cd3038d1402f14", "cd445e95bc5d9c88d2042f94063ff8033f88268f"], "merge_commit_fingerprint": {"message": "fix: TUI Backspace submits partial Unicode graphemes (#21229)\n\n## Background\n\nBackspace in published @ai-sdk/tui prompts could submit corrupted or\npartial Unicode graphemes, including unpaired emoji surrogates and\nincomplete combining or joined sequences.\n\n## Root Cause\n\nThe Backspace handler used slice(0, -1), which removes one UTF-16 code\nunit rather than one displayed grapheme. The reproduction confirmed\npartial submissions for emoji, combining characters, and joined emoji\nthrough both DEL and BS encodings.\n\n## Summary\n\nChanged prompt deletion to remove the final Intl.Segmenter grapheme\ncluster, enabled the required Intl TypeScript library, removed\nreproduction-only artifacts, and added a patch changeset.\n\n## Testing\n\nAdded prompt submission regressions covering DEL and BS emoji deletion,\ncombining-character sequences, and joined emoji sequences.\n\n## End-to-end Validation\n\n- `pnpm -C examples/ai-functions exec tsx\nsrc/reproduction/issue-21225-tui-backspace-grapheme.ts` via immutable\nreplay exited successfully and reported that the issue was not present.\n\n## Related Issues\n\nFixes #21225\n\nCloses #21227\n\n---------\n\nCo-authored-by: ai-sdk-factory <308175966+ai-sdk-factory@users.noreply.github.com>\nCo-authored-by: dakjdakd <164857476+dakjdakd@users.noreply.github.com>", "author": {"name": "ai-sdk-factory[bot]", "email": "305873210+ai-sdk-factory[bot]@users.noreply.github.com", "date": "2026-09-21T18:56:19Z"}}}], "commits": [{"repo": "morluto/rea", "sha": "8b4c3de3b3a3b580adec266f94f29ccedf1da228", "branch": "main", "html_url": "https://github.com/morluto/rea/commit/8b4c3de3b3a3b580adec266f94f29ccedf1da228", "title": "fix(browser): seed storage by browser partition", "committed_at": "2026-10-11T10:17:53.000+08:00"}, {"repo": "morluto/rea", "sha": "a0523b375eb3147f1d2d1e7eb10a2f4546f5d0fc", "branch": "main", "html_url": "https://github.com/morluto/rea/commit/a0523b375eb3147f1d2d1e7eb10a2f4546f5d0fc", "title": "fix(browser): retain attached scenario emulation until cleanup", "committed_at": "2026-10-10T01:45:00.000+08:00"}, {"repo": "morluto/rea", "sha": "5e8fb531e255a4a04fc053c54096f66d5c84cde3", "branch": "main", "html_url": "https://github.com/morluto/rea/commit/5e8fb531e255a4a04fc053c54096f66d5c84cde3", "title": "fix(artifacts): reject incomplete inventoried extraction", "committed_at": "2026-10-10T01:45:00.000+08:00"}, {"repo": "aoci-spec/aoci-code", "sha": "d3716a809af7c01f12044170bda81b3fb3cdcd94", "branch": "main", "html_url": "https://github.com/aoci-spec/aoci-code/commit/d3716a809af7c01f12044170bda81b3fb3cdcd94", "title": "fix(cli): honor --json for config commands", "committed_at": "2026-10-05T18:15:35.000+08:00"}, {"repo": "qquante/typed-decision-layer", "sha": "664867afeecf9eb83cf9851ce8ab6490dd256d13", "branch": "main", "html_url": "https://github.com/qquante/typed-decision-layer/commit/664867afeecf9eb83cf9851ce8ab6490dd256d13", "title": "fix(structured): reject enum choice label collisions", "committed_at": "2026-09-25T03:47:43.000+08:00"}, {"repo": "qquante/typed-decision-layer", "sha": "4e const contributions = [...DATA.prs.map(p=>({...p,type:'pr',date:p.merged_at})),...(DATA.commits||[]).map(c=>({...c,type:'commit',date:c.committed_at}))].sort((a,b)=>b.date.localeCompare(a.date)||b.html_url.localeCompare(a.html_url));
const projects = new Map(DATA.projects.map(p=>[p.repo,p]));
const initial = new URLSearchParams(location.search);
const state = {page:Math.max(1,Math.floor(Number(initial.get('page')))||1), repo:initial.get('project')||'', query:(initial.get('search')||'').trim().toLowerCase()};
const $ = id=>document.getElementById(id);
const esc = value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtStars = value=>value>=1000?(value/1000).toFixed(1)+'k':String(value);
const date = value=>{const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));return parts.find(p=>p.type==='month').value+'.'+parts.find(p=>p.type==='day').value};
const outgoing = (url,label,cls='',title='')=>`<a href="${esc(url)}" target="_blank" rel="noopener" class="${cls}"${title?` title="${esc(title)}"`:''}>${label}</a>`;
function parsedTitle(title){const match=title.match(/^(?:(Python|\.NET):\s*)?(fix|test|feat|docs|chore|refactor)(?:\(([^)]+)\))?:\s*(.*)$/i);return match?{title:match[4],kind:match[2].toUpperCase(),scope:[match[1],match[3]].filter(Boolean).join(' / ')}:{title,kind:'PR',scope:''}}
function badges(p){return p.badges.map(b=>outgoing(b.url,`<img src="${esc(b.image)}" alt="${esc(b.name)} · 完整官方徽章" referrerpolicy="no-referrer" onerror="this.hidden=true;this.parentElement.classList.add('unavailable')"><span class="badge-fallback">${esc(b.label)}<br>${esc(b.name)} ↗</span>`,`official-badge ${b.kind}`,`${b.name} · 项目 README 中的官方徽章，点击查看来源`)).join('')}
const expanded = new Set();
function projectPr(pr){const t=parsedTitle(pr.title),isCommit=pr.type==='commit';return `<div class="project-pr">${outgoing(pr.html_url,esc(t.title),'contribution-title')}<div class="meta">${outgoing(pr.html_url,isCommit?esc(pr.sha.slice(0,7)):'#'+pr.number,'',isCommit?`Commit ${pr.sha} · ${pr.branch}`:'')}<span class="separator">/</span><span class="kind">${esc(t.kind==='PR'&&isCommit?'COMMIT':t.kind)}</span>${t.scope?`<span>${esc(t.scope)}</span><span class="separator">/</span>`:''}<time datetime="${esc(pr.date)}">${new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(pr.date))}</time><span class="merged"${isCommit?` title="${esc(pr.branch)}"`:''}>${isCommit?'MAIN BRANCH':'MERGED'}</span></div></div>`}

function block(p,index,prs){const all=contributions.filter(pr=>pr.repo===p.repo),count=all.length,prCount=all.filter(pr=>pr.type==='pr').length,commitCount=count-prCount;return `<article class="project-block"><div class="project-header"><span class="index">${String(index+1).padStart(2,'0')}</span><div>${outgoing(p.url,esc(p.name),'project-name')}<div class="repo">${esc(p.repo)}</div><p class="project-description">${esc(p.description)}</p>${p.badges.length?`<div class="project-badges">${badges(p)}</div>`:''}</div><div class="project-stats"><span class="contribution-count"><strong>${count}</strong> CONTRIBUTION${count===1?'':'S'}</span><span class="contribution-breakdown">${prCount} PR${prCount===1?'':'s'} · ${commitCount} commit${commitCount===1?'':'s'}</span><span class="stars">★ ${fmtStars(p.stars)} <small>STARS</small></span></div></div><div class="project-contributions">${prs.slice(0,2).map(projectPr).join('')}${prs.length>2?`<details class="more-contributions" data-expand="${esc(p.repo)}" ${expanded.has(p.repo)?'open':''}><summary><span class="expand-label">+ SHOW ${prs.length-2} MORE CONTRIBUTION${prs.length-2===1?'':'S'}</span><span class="collapse-label">− COLLAPSE CONTRIBUTIONS</span></summary><div class="more-prs">${prs.slice(2).map(projectPr).join('')}</div></details>`:''}</div><div class="project-actions">${outgoing(p.url,'PROJECT REPOSITORY ↗')}</div></article>`}

function filtered(){return contributions.filter(p=>(!state.repo||p.repo===state.repo)&&(!state.query||(p.repo+' '+p.title+' '+(p.number||p.sha)+' '+projects.get(p.repo).name).toLowerCase().includes(state.query)))}
function render(){
  const prs=filtered(),items=[...new Set(prs.map(p=>p.repo))].map(repo=>projects.get(repo)),size=6,total=items.length,pages=Math.max(1,Math.ceil(total/size));
  state.page=Math.min(state.page,pages);const start=(state.page-1)*size,visible=items.slice(start,start+size);
  $('section-tag').textContent=`> PROJECT DIRECTORY [${String(total).padStart(2,'0')}]`;
  $('list').innerHTML=total?visible.map((p,i)=>block(p,start+i,prs.filter(pr=>pr.repo===p.repo))).join(''):'<div class="empty">NO MATCHING CONTRIBUTIONS_<button id="clear">CLEAR FILTERS</button></div>';
  $('range').textContent=total?`${String(start+1).padStart(2,'0')}–${String(start+visible.length).padStart(2,'0')} OF ${String(total).padStart(2,'0')} PROJECTS / PAGE ${state.page} OF ${pages}`:'0 MATCHES';
  const numbers=Array.from({length:pages},(_,i)=>i+1).filter(n=>n===1||n===pages||Math.abs(n-state.page)<=1);
  $('page-controls').innerHTML=`<button class="direction" data-page="${state.page-1}" ${state.page===1?'disabled':''} aria-label="上一页">← PREV</button>${numbers.map((n,i)=>(i&&n>numbers[i-1]+1?'<span class="page-gap" aria-hidden="true">…</span>':'')+`<button data-page="${n}" ${state.page===n?'aria-current="page"':''} aria-label="第 ${n} 页">${n}</button>`).join('')}<button class="direction" data-page="${state.page+1}" ${state.page===pages?'disabled':''} aria-label="下一页">NEXT →</button>`;
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{state.page=Number(b.dataset.page);render();document.querySelector(`[data-page="${state.page}"]`).focus({preventScroll:true})}));
  document.querySelectorAll('[data-expand]').forEach(d=>d.addEventListener('toggle',()=>{d.open?expanded.add(d.dataset.expand):expanded.delete(d.dataset.expand)}));
  if($('clear'))$('clear').addEventListener('click',()=>{state.repo='';state.query='';state.page=1;$('project-filter').value='';$('search').value='';render();$('search').focus({preventScroll:true})});
  const params=new URLSearchParams();if(state.page>1)params.set('page',state.page);if(state.repo)params.set('project',state.repo);if(state.query)params.set('search',state.query);
  history.replaceState(null,'',location.pathname+(params.size?'?'+params.toString():''));
}
$('pr-count').textContent=String(contributions.length).padStart(2,'0');$('project-count').textContent=String(DATA.projects.length).padStart(2,'0');$('latest').textContent=contributions.length?date(contributions[0].date):'--';
$('hero-summary').textContent=`COMMUNITY CONTRIBUTIONS SYNCED / ${DATA.prs.length} MERGED PRs + ${(DATA.commits||[]).length} MAIN-BRANCH COMMITS`;
$('footer-updated').textContent='> LAST SYNC: '+new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'short'}).format(new Date(DATA.updated_at))+' CST';
$('project-filter').innerHTML='<option value="">PROJECT: ALL</option>'+DATA.projects.map(p=>`<option value="${esc(p.repo)}">${esc(p.name)}</option>`).join('');
$('project-filter').value=state.repo;$('search').value=state.query;
$('project-filter').addEventListener('change',e=>{state.repo=e.target.value;state.page=1;render()});
$('search').addEventListener('input',e=>{state.query=e.target.value.trim().toLowerCase();state.page=1;render()});render();

</script>
