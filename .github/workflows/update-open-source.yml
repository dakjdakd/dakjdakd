name: Update open source panel

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
    # Daily historical reconciliation; frequent runs prioritize new activity.
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan complete commit history (slower)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/fonts/**"
      - ".github/workflows/update-open-source.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: open-source-panel
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/test_update_open_source.py
      - id: collect
        run: python scripts/update_open_source.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_HISTORY: ${{ github.event.schedule == '23 19 * * *' || inputs.full_history == true }}
      - if: steps.collect.outputs.changed == 'true'
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python scripts/update_open_source.py --render
      - if: steps.collect.outputs.changed == 'true'
        run: |
          git add assets/open-source-terminal.gif docs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update open source contributions panel"
          git pull --rebase origin main
          git push
      - if: steps.collect.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - if: steps.collect.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        if: steps.collect.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
